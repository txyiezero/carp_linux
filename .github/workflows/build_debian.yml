name: Build CARP Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:13.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get -y install build-essential linux-headers-amd64

      - name: Build kernel module
        run: |
          KDIR=$(ls -d /lib/modules/*/build | head -1)
          make module KDIR=$KDIR

      - name: Build userspace tool
        run: make tools

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp kmod/carp.ko artifacts/
          cp tools/carpctl artifacts/
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carp-linux-debian13.5
          path: artifacts/
          retention-days: 30
